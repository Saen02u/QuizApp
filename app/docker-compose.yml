version: '3.9'
services:
  db:
    image: mysql:8
    volumes:
#      - ./mysql/initdb:/docker-entrypoint-initdb.d
      - ./mysql/log:/var/lib/mysql/log
      - ./mysql/db:/var/lib/mysql
      - ./mysql/conf:/etc/mysql/conf.d
    container_name: quiz_db
    restart: unless-stopped
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD: rootpw
      - MYSQL_USER: toshwm
      - MYSQL_PASSWORD: tltmxpaznlwm
      - MYSQL_DATABASE: quiz_db
      - MYSQL_CHARSET: utf8mb4
      - MYSQL_COLLATION: utf8mb4_unicode_ci
      - TZ: Asia/Seoul
    networks:
      quiz_db:
  web:
    build: .
    depends_on: 
      - quiz_db
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - 8703:3000
    environment:
      - DB_HOST=quiz_db
      - DB_PORT=3306
      - DB_USER=toshwm
      - DB_PASSWORD=tltmxpaznlwm
      - DB_DATABASE=quiz_db
networks:
  quiz_db: {}
